name: Reusable Backend Pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.0.1
        with:
          node-version: 20
          cache: 'npm'
      - run: cd backend && npm ci
      - run: cd backend && npm test
