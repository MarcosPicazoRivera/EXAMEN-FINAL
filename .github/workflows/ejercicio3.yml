name: Enterprise Matrix Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18.x', '20.x']
        mode: [debug, release]
        
        exclude:
          - os: windows-latest
            node: '18.x'
            mode: debug
            
        include:
          - os: ubuntu-latest
            node: '20.x'
            mode: release
            environment: production
            extra_var: 'SUPER_SECRET'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4.1.1

      - name: Configurar Node ${{ matrix.node }}
        uses: actions/setup-node@v4.0.1
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Configurar Node ${{ matrix.node }}
        uses: actions/setup-node@v4.0.1
        with:
          node-version: ${{ matrix.node }}

      - name: Generar Job Summary
        shell: bash 
        run: |
          echo "### Resumen de Ejecución Enterprise." >> $GITHUB_STEP_SUMMARY
          echo "- SO: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node: ${{ matrix.node }}" >> $GITHUB_STEP_SUMMARY
          echo "- Modo: ${{ matrix.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Entorno: ${{ matrix.environment || 'development' }}" >> $GITHUB_STEP_SUMMARY

      - name: Subir Artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: reporte-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.mode }}
          path: build_output/
